# Experiment matrix registry for ablations, sweeps, and paper tables.
# A matrix groups related experiments by shared research question and variable axes.
version: 1
matrices:
  - matrix_id: mat-001
    slug: decision-surface-protocol-validation
    research_question: Does a reliability-budget condition grid reveal fusion-template decision failures that clean-only or single-axis evaluation hides?
    primary_variable: evaluation_surface
    controlled_axes:
      - dataset
      - template_registry
      - feature_extractor
      - seeds
      - hardware_target
      - budget_definition
      - reliability_proxy_boundary
    likely_paper_target: pilot diagnostic table
  - matrix_id: mat-002
    slug: evidence-governance-pilot
    research_question: Can MLLMs act consistently on their own diagnosis of unreliable audio-video evidence under textual queries?
    primary_variable: diagnosis_to_action_protocol
    controlled_axes:
      - dataset_family
      - modality_necessity_filter
      - corruption_family
      - annotation_schema
      - frozen_diagnosis_action_mapping
      - model_panel
      - hardware_target
    likely_paper_target: diagnosis-to-action pilot table
