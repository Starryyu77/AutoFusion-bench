# Canonical variable registry for paper and experiment maintenance.
# Use stable var_id values in experiment metadata; keep paper labels human-readable.
version: 1
variables:
  - var_id: var-001
    canonical_name: evaluation_surface
    paper_label: Reliability-budget decision surface
    code_keys:
      - evaluation.surface
      - protocol.condition_grid
    type: categorical
    role: independent_variable
    allowed_values:
      - clean_only
      - reliability_budget_2x2
  - var_id: var-002
    canonical_name: diagnosis_to_action_protocol
    paper_label: Diagnosis-to-action evidence governance protocol
    code_keys:
      - protocol.diagnosis_to_action
      - protocol.evidence_governance
    type: categorical
    role: independent_variable
    allowed_values:
      - absent
      - audio_video_textual_query_pilot
