    - AVQA_MUSIC_AVQA source selection
    - modality necessity labeling
    - controlled audio-video corruption manifest
    - human recoverability route abstention labels
    - diagnosis-only structured prompt
    - model action from frozen diagnosis
    - fixed rule from same frozen diagnosis
    - oracle route and oracle defect-location probes
