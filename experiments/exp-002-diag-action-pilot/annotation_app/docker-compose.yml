services:
  annotation-app:
    build:
      context: .
    ports:
      - "${ANNOTATION_APP_PORT:-8000}:8000"
    environment:
      AUTOFUSION_REPO_ROOT: /repo
      ANNOTATION_DB_PATH: /state/annotations.sqlite
      ANNOTATION_MEDIA_MAP: ${ANNOTATION_MEDIA_MAP:-/usr1/home/s125mdg43_10/datasets=/media/datasets;/usr1/home/s125mdg43_10/projects/AutoFusion-bench=/repo}
    volumes:
      - ../../..:/repo
      - ./state:/state
      - ${MEDIA_ROOT:-../outputs/media_smoke}:/media:ro

